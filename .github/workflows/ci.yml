name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # GitHub Actions sets the CI variable, which turns on ContinuousIntegrationBuild
      # in Directory.Build.props, so restore runs with RestoreLockedMode.
      # An out-of-date packages.lock.json fails here.
      - name: Restore
        run: dotnet restore Logora.slnx

      - name: Build
        run: bash eng/build.sh --no-restore

      - name: Test
        run: bash eng/test.sh --no-build

      # Warnings must not fail the build, so only count them and write the totals
      # to the job summary.
      - name: Summarize warnings
        if: always()
        run: bash eng/summarize-warnings.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: artifacts/log/
          if-no-files-found: ignore

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck は GitHub ホストの Ubuntu ランナーに最初から入っているので、導入の手順は要らない。
      # そのためバージョンはランナー イメージに従い、上の action のように固定されていない。
      # ランナーの更新で、スクリプトに触れていないプル リクエストに新しい指摘が出ることがある。
      #
      # 検査対象はここに列挙せず git から集めるので、スクリプトを足してもこのワークフローは変えなくてよい。
      # 拾う基準は拡張子 .sh。git hook も .gitconfig でファイル名を明示しているため、この拡張子を付けられる。
      # 当てはまらないスクリプトは黙って対象外になるので、pathspec を広げるより命名に合わせること。
      # ShellCheck は成功時に何も出力せず、「全部検査して問題なし」と「ほとんど検査していない」の区別が
      # ログから付かないため、対象ファイルの一覧を出力する。
      #
      # ShellCheck は既定のルール セットで実行する。オプションのチェック（shellcheck --list-optional）は
      # 有効にしない。SC1091 などの抑止は必要な箇所ごとに書き、それ以外の場所では同じルールを効かせ続ける。
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No shell script matched the pathspec. The file selection is broken."
            exit 1
          fi
          printf 'Checking %s\n' "${files[@]}"
          shellcheck -- "${files[@]}"

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository

      # ShellCheck のジョブと同じ理由で、対象ファイルの一覧を出し、0 件なら落とす。
      # 指摘が無いのと、そもそも何も検査していないのとが、ログから区別できないため。
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $files = Get-ChildItem -Path . -Recurse -File -Include '*.ps1', '*.psd1', '*.psm1'
          if (-not $files) {
              throw 'PowerShell スクリプトが 1 つも見つかりませんでした。検査対象の選び方が壊れています。'
          }

          $files | ForEach-Object { "Checking $($_.FullName)" }

          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) {
              throw "PSScriptAnalyzer で $($results.Count) 件の指摘が見つかりました。"
          }
